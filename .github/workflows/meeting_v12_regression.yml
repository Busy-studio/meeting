name: Meeting v1.2 regression

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python syntax
        run: python -m compileall -q app.py src tests
      - name: Internal staff, Excel and download unit tests
        run: python -m unittest discover -s tests -v
