name: Meeting v1.2 regression

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python syntax
        run: python -m compileall -q app.py src tests
      - name: Install PDF conversion dependencies
        run: |
          python -m pip install 'pypdf>=5,<8' 'reportlab>=4,<5' 'pymupdf>=1.24,<2'
          sudo apt-get update
          sudo apt-get install -y libreoffice-calc fonts-nanum
      - name: Internal staff, Excel, PDF and download tests
        run: python -m unittest discover -s tests -v
